name: Release

# Publishes to PyPI when a version tag (v0.1.0, ...) is pushed, with PyPI Trusted Publishing
# (GitHub OIDC): no PyPI token is stored. Before the first tag, add a (pending) trusted publisher
# for pipecat-finesse on PyPI: repository homingos/pipecat-finesse, workflow release.yml,
# environment pypi.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Tag matches the package version
        run: |
          v=$(uv run --no-project python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          src=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' src/pipecat_finesse/_version.py)
          if [ "v$v" != "$GITHUB_REF_NAME" ] || [ "$src" != "$v" ]; then
            echo "tag $GITHUB_REF_NAME, pyproject.toml $v and _version.py $src must all match" >&2
            exit 1
          fi
      - run: uvx ruff@0.14.0 check src tests examples
      - run: uvx ruff@0.14.0 format --check src tests examples
      - run: uv run --with pyright pyright src
      - run: uv run pytest -q
      - run: uv build
      - run: uvx twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # OIDC token for PyPI Trusted Publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@v6
      - run: uv publish --trusted-publishing always
