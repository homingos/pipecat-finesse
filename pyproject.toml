[project]
name = "pipecat-finesse"
version = "0.1.0"
description = "Finesse text-to-speech for Pipecat"
readme = "README.md"
license = "BSD-2-Clause"
license-files = ["LICENSE"]
authors = [{ name = "Flam" }]
keywords = ["pipecat", "tts", "text-to-speech", "voice", "finesse", "indic"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
requires-python = ">=3.11"
dependencies = [
    "pipecat-ai[websocket]>=1.12,<2",
]

[build-system]
requires = ["uv_build>=0.9.10,<0.10.0"]
build-backend = "uv_build"

[project.urls]
Homepage = "https://finesse.flamapp.ai"
Documentation = "https://docs.finesse.flamapp.ai/voice-api/realtime-websocket"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
